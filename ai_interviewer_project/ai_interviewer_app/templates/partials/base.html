<!DOCTYPE html>
<html lang="en">
<head>
  <style>
  html, body {
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
}

body.allow-scroll {
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
  --bg: 0 0% 98%;
  --fg: 0 0% 12%;
  --muted: 0 0% 94%;
  --muted-fg: 0 0% 40%;
  --border: 0 0% 88%;
  --primary: 270 70% 50%;
  --success: 150 50% 40%;
  --warning: 38 92% 50%;
  --destructive: 0 65% 50%;
  --secondary: 0 0% 94%;
  --secondary-fg: 0 0% 20%;
  --card: 0 0% 100%;
  --accent: 270 70% 50%;
  --primary-fg: 0 0% 100%;
}

body {
  font-family: 'Space Grotesk', system-ui, sans-serif;
  background: hsl(var(--bg));
  color: hsl(var(--fg));
  min-height: 100vh;
  letter-spacing: -0.01em;
}

  .text-gradient {
    background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--accent)));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .gradient-primary {
    background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--accent)));
  }
  .glow-primary {
    box-shadow: 0 0 20px hsl(var(--primary) / 0.3);
  }
  .screen { display: none; }
  .screen.active { display: block; }
  /* Orb decorations */
  .orb { position: absolute; border-radius: 50%; pointer-events: none; animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .animate-fade-in { animation: fadeIn 0.6s ease-out; }
  .animate-slide-up { animation: slideUp 0.6s ease-out; }
  /* Color helpers */
  .c-success { color: hsl(var(--success)); }
  .c-primary { color: hsl(var(--primary)); }
  .c-warning { color: hsl(var(--warning)); }
  .c-destructive { color: hsl(var(--destructive)); }
  .bg-success { background: hsl(var(--success)); }
  .bg-warning { background: hsl(var(--warning)); }
  .bg-destructive { background: hsl(var(--destructive)); }
  /* SVG icon sizing */
  .icon { width: 16px; height: 16px; display: inline-block; vertical-align: middle; }
  .icon-lg { width: 20px; height: 20px; }
  .icon-xl { width: 32px; height: 32px; }
  .glass,
  .glass-subtle {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
  }
  .btn-primary {
    width: 100%;
    height: 3rem;
    border-radius: 0;
    font-size: 0.9rem;
    font-weight: 500;
    background: hsl(var(--primary));
    border: 1px solid hsl(var(--primary));
    color: hsl(var(--primary-fg));
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }
  .btn-primary:disabled,
  .btn-primary[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
    border-color: hsl(var(--border));
    color: hsl(var(--muted-fg));
  }
  .btn-primary:disabled:hover,
  .btn-primary[disabled]:hover {
    background: hsl(var(--card));
  }
  .mic-active {
  background: hsl(var(--destructive) / 0.2);
  border: 1px solid hsl(var(--destructive));
  box-shadow: 0 0 15px hsl(var(--destructive) / 0.4);
}
  button:hover {
    border-color: hsl(var(--primary));
    color: hsl(var(--primary));
  }

  .icon { width: 16px; height: 16px; display: inline-block; vertical-align: middle; }
  .icon-lg { width: 20px; height: 20px; }
  .icon-xl { width: 32px; height: 32px; }
  </style>
</head>
<body>
  <script>
  // ===== STATE (shared) =====
  let profile = { name: '', role: '', experienceLevel: '', techStack: '' };
  let selectedExp = '';
  let questions = [];
  let chatMessages = [];
  let questionIndex = 1;
  let isTyping = false;
  let recognition;
  let isRecording = false;
  let voiceEnabled = false;
  let isVoiceMode = false;

  // ===== DOM HELPER =====
  const $ = id => document.getElementById(id);

  // ===== SHARED HELPERS =====
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');

    // Only the scorecard needs page scroll; other screens manage their own layout.
    if (id === 'scorecard') {
      document.body.classList.add('allow-scroll');
    } else {
      document.body.classList.remove('allow-scroll');
    }
  }

  function scoreColor(s) {
    return s >= 80 ? 'c-success' : s >= 60 ? 'c-primary' : s >= 40 ? 'c-warning' : 'c-destructive';
  }

  function scoreBg(s) {
    return s >= 80 ? 'bg-success' : s >= 60 ? 'gradient-primary' : s >= 40 ? 'bg-warning' : 'bg-destructive';
  }

  function recIcon(s) {
    if (s >= 80) return `<svg class="icon" fill="none" stroke="hsl(var(--success))" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
    if (s >= 50) return `<svg class="icon" fill="none" stroke="hsl(var(--warning))" stroke-width="2" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
    return `<svg class="icon" fill="none" stroke="hsl(var(--destructive))" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
  }
  </script>
</body>
</html>
