<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Interviewer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body {
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
}

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
  --bg: 0 0% 0%;
  --fg: 0 0% 92%;
  --muted: 0 0% 10%;
  --muted-fg: 0 0% 55%;
  --border: 0 0% 18%;
  --primary: 270 100% 70%;   /* Neon Accent */
  --success: 150 60% 50%;
  --warning: 40 90% 55%;
  --destructive: 0 75% 55%;
  --secondary: 0 0% 12%;
  --secondary-fg: 0 0% 80%;
  --card: 0 0% 6%;
  --accent: 270 100% 70%;
  --primary-fg: 0 0% 100%;
}

body {
  font-family: 'Space Grotesk', system-ui, sans-serif;
  background: #000;
  color: hsl(var(--fg));
  min-height: 100vh;
  letter-spacing: -0.01em;
}

  .text-gradient {
    background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--accent)));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .screen { display: none; }
  .screen.active { display: block; }
  /* Orb decorations */
  .orb { position: absolute; border-radius: 50%; pointer-events: none; animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .animate-fade-in { animation: fadeIn 0.6s ease-out; }
  .animate-slide-up { animation: slideUp 0.6s ease-out; }
  /* ===== SETUP SCREEN ===== */
  #setup { min-height: 100vh; display: none; align-items: center; justify-content: center; padding: 1rem; position: relative; }
  #setup.active { display: flex; }
  .setup-card { width: 100%; max-width: 28rem; position: relative; z-index: 10; }
  .setup-header { text-align: center; margin-bottom: 2.5rem; }
  .setup-icon { display: inline-flex; align-items: center; justify-content: center; width: 4rem; height: 4rem; border-radius: 1rem; margin-bottom: 1.5rem; }
  .setup-title { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
  .setup-subtitle { color: hsl(var(--muted-fg)); font-size: 0.875rem; }
  .form-group { margin-bottom: 1.25rem; }
  .form-label { display: block; font-size: 0.75rem; font-weight: 500; color: hsl(var(--secondary-fg)); margin-bottom: 0.5rem; }
  .form-label svg { display: inline; vertical-align: -2px; margin-right: 4px; }
  .form-input, .form-select {
    width: 100%; height: 2.75rem; padding: 0 0.75rem; border-radius: 0.75rem; font-size: 0.875rem;
    background: hsl(var(--muted) / 0.5); border: 1px solid hsl(var(--border) / 0.5); color: hsl(var(--fg));
    font-family: inherit; outline: none; transition: border-color 0.2s;
  }
  .form-input:focus, .form-select:focus { border-color: hsl(var(--primary)); }
  .form-select option { background: hsl(var(--card)); color: hsl(var(--fg)); }
  .exp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .exp-btn {
    padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.8rem; font-weight: 500; cursor: pointer;
    border: 1px solid hsl(var(--border) / 0.5); background: hsl(var(--muted) / 0.3); color: hsl(var(--muted-fg));
    font-family: inherit; transition: all 0.2s;
  }
  .exp-btn:hover { border-color: hsl(var(--primary) / 0.4); background: hsl(var(--muted) / 0.5); }
  .exp-btn.selected { border-color: hsl(var(--primary)); background: hsl(var(--primary) / 0.15); color: hsl(var(--primary)); }
  .btn-primary {
    width: 100%; height: 3rem; border: none; border-radius: 0.75rem; font-size: 1rem; font-weight: 600;
    color: hsl(var(--primary-fg)); cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary:not(:disabled):hover { opacity: 0.9; transform: scale(1.01); }
  /* ===== CHAT SCREEN ===== */
  #interview {
  display: flex;
  flex-direction: column;
  height: 100dvh; /* dynamic viewport height */
  overflow: hidden;
  position: relative;
}

  #interview.active { display: flex; }
  .chat-topbar {
  border-bottom: 1px solid hsl(var(--border));
  background: #000;
}
  .chat-topbar-inner { max-width: 48rem; margin: 0 auto; padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between; }
  .topbar-left { display: flex; align-items: center; gap: 0.75rem; }
  .topbar-avatar {
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  border: 1px solid hsl(var(--primary));
  display: flex;
  align-items: center;
  justify-content: center;
}

  .topbar-title { font-size: 0.875rem; font-weight: 600; }
  .topbar-sub { font-size: 0.7rem; color: hsl(var(--muted-fg)); }
  .topbar-right {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

/* Keep progress compact */
.progress-wrapper {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* Toggle styling */
.mode-switch {
  display: flex;
  align-items: center;
  gap: 6px;
}

.mode-label {
  font-size: 11px;
  opacity: 0.6;
  letter-spacing: 0.5px;
}

.toggle {
  width: 38px;
  height: 20px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.2);
  position: relative;
  cursor: pointer;
  transition: 0.3s ease;
}

.toggle::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: white;
  top: 2px;
  left: 3px;
  transition: 0.3s ease;
}

.toggle.active {
  border-color: #7c3aed;
}

.toggle.active::after {
  left: 20px;
  background: #7c3aed;
}

  .progress-text { font-size: 0.7rem; color: hsl(var(--muted-fg)); font-family: 'JetBrains Mono', monospace; }
  .progress-bar {
  width: 6rem;
  height: 2px;
  background: hsl(var(--border));
}
.progress-fill {
  height: 100%;
  background: hsl(var(--primary));
}

  .messages-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .messages-inner { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1rem; }
  .msg-row { display: flex; gap: 0.75rem; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar { width: 2rem; height: 2rem; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.75rem; }
  .msg-avatar.bot { color: hsl(var(--primary-fg)); }
  .msg-avatar.human { background: hsl(var(--secondary) / 0.8); color: hsl(var(--secondary-fg)); }
  .msg-bubble {
  max-width: 70%;
  padding: 0.9rem 1.1rem;
  border-radius: 0;
  font-size: 0.9rem;
  line-height: 1.7;
}

.msg-bubble.bot {
  border-left: 2px solid hsl(var(--primary));
  padding-left: 1rem;
}

.msg-bubble.human {
  border-right: 2px solid hsl(var(--primary));
  padding-right: 1rem;
}

  .typing-dots { display: flex; gap: 4px; padding: 0.75rem 1rem; }
  .typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--primary) / 0.6); animation: bounce 0.6s ease-in-out infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  .chat-input-bar {
    border-top: 1px solid hsl(var(--border));
    background: #000;
  }
  .chat-input-inner {
    max-width: 48rem;
    margin: 0 auto;
    padding: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .chat-input {
    flex: 1; height: 3rem; padding: 0 0.75rem; border-radius: 0.75rem; font-size: 0.875rem;
    background: hsl(var(--muted) / 0.4); border: 1px solid hsl(var(--border) / 0.4); color: hsl(var(--fg));
    font-family: inherit; outline: none;
  }
  .chat-input:focus { border-color: hsl(var(--primary)); }

  /* ===== SCORECARD SCREEN ===== */
  #scorecard { min-height: 100vh; padding: 1rem; position: relative; }
  #scorecard.active { display: block; }
  .sc-container { max-width: 56rem; margin: 0 auto; position: relative; z-index: 10; }
  .sc-section { border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.25rem; }
  @media (min-width: 768px) { .sc-section { padding: 2rem; } #scorecard { padding: 2rem; } }
  .sc-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; color: hsl(var(--muted-fg)); font-weight: 500; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
  .sc-name { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; }
  .sc-meta { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.8rem; color: hsl(var(--muted-fg)); margin-bottom: 1rem; }
  .sc-role { font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; }
  .sc-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
  .sc-info-card { background: hsl(var(--muted) / 0.3); border-radius: 0.75rem; padding: 1rem; border: 1px solid hsl(var(--border) / 0.3); }
  .sc-info-card .label { font-size: 0.65rem; color: hsl(var(--muted-fg)); margin-bottom: 0.25rem; }
  .sc-info-card .value { font-size: 0.8rem; font-weight: 600; text-transform: capitalize; }
  .sc-heading { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
  .sc-round-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .sc-round-card { background: hsl(var(--muted) / 0.2); border-radius: 0.75rem; padding: 1.5rem; border: 1px solid hsl(var(--border) / 0.3); text-align: center; }
  .sc-round-label { font-size: 0.8rem; color: hsl(var(--muted-fg)); margin-bottom: 0.5rem; }
  .sc-round-score { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; }
  .sc-round-total { font-size: 1rem; color: hsl(var(--muted-fg)); }
  .sc-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
  .sc-stat-card { background: hsl(var(--muted) / 0.2); border-radius: 0.75rem; padding: 1rem; border: 1px solid hsl(var(--border) / 0.3); }
  .sc-stat-name { font-size: 0.7rem; color: hsl(var(--muted-fg)); margin-bottom: 0.5rem; }
  .sc-stat-row { display: flex; align-items: center; gap: 0.75rem; }
  .sc-stat-val { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 700; }
  .sc-bar { flex: 1; height: 6px; background: hsl(var(--muted) / 0.4); border-radius: 9999px; overflow: hidden; }
  .sc-bar-fill { height: 100%; border-radius: 9999px; transition: width 1s; }
  .sc-review-item { background: hsl(var(--muted) / 0.1); border-radius: 0.75rem; padding: 1rem; border: 1px solid hsl(var(--border) / 0.2); margin-bottom: 0.75rem; }
  .sc-review-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.5rem; }
  .sc-review-title .score { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; }
  .sc-review-text { font-size: 0.75rem; color: hsl(var(--muted-fg)); line-height: 1.6; padding-left: 1.5rem; }
  .sc-section-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: hsl(var(--muted-fg)); margin-bottom: 1rem; }
  .sc-proctor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; }
  .sc-proctor-card { background: hsl(var(--muted) / 0.2); border-radius: 0.75rem; padding: 1rem; border: 1px solid hsl(var(--border) / 0.3); display: flex; align-items: center; gap: 0.75rem; }
  .sc-proctor-label { font-size: 0.85rem; font-weight: 500; }
  .sc-proctor-status { font-size: 0.7rem; color: hsl(var(--success)); }
  .sc-rec-item { display: flex; align-items: flex-start; gap: 0.75rem; background: hsl(var(--muted) / 0.1); border-radius: 0.75rem; padding: 1rem; border: 1px solid hsl(var(--border) / 0.2); margin-bottom: 0.75rem; }
  .sc-rec-text { font-size: 0.8rem; color: hsl(var(--muted-fg)); line-height: 1.5; }
  .btn-outline {
    flex: 1; height: 3rem; border-radius: 0.75rem; font-size: 0.9rem; font-weight: 600;
    color: hsl(var(--secondary-fg)); cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .btn-outline:hover { background: hsl(var(--secondary) / 0.5); transform: scale(1.01); }
  /* Color helpers */
  .c-success { color: hsl(var(--success)); }
  .c-primary { color: hsl(var(--primary)); }
  .c-warning { color: hsl(var(--warning)); }
  .c-destructive { color: hsl(var(--destructive)); }
  .bg-success { background: hsl(var(--success)); }
  .bg-warning { background: hsl(var(--warning)); }
  .bg-destructive { background: hsl(var(--destructive)); }
  /* SVG icon sizing */
  .icon { width: 16px; height: 16px; display: inline-block; vertical-align: middle; }
  .icon-lg { width: 20px; height: 20px; }
  .icon-xl { width: 32px; height: 32px; }
  .mic-active {
  background: hsl(var(--destructive) / 0.2);
  border: 1px solid hsl(var(--destructive));
  box-shadow: 0 0 15px hsl(var(--destructive) / 0.4);
}
  button:hover {
    border-color: hsl(var(--primary));
    color: hsl(var(--primary));
  }
  .chat-send:hover {
    border-color: hsl(var(--primary));
  }
  .glass,
  .glass-subtle {
    background: #000;
    border: 1px solid hsl(var(--border));
  }
  .btn-primary {
    width: 100%;
    height: 3rem;
    border-radius: 0;
    font-size: 0.9rem;
    font-weight: 500;
    background: #000;
    border: 1px solid hsl(var(--primary));
    color: hsl(var(--primary));
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-primary:hover {
    background: hsl(var(--primary) / 0.1);
  }

  .skip-btn {
    position: relative;
    background: none;
    border: none;
    font-size: 0.85rem;
    color: hsl(var(--muted-fg));
    cursor: pointer;
    padding: 0.5rem 0.75rem;
    transition: color 0.2s ease;
  }

  .skip-btn:hover {
    color: hsl(var(--primary));
  }
  .skip-tooltip {
    position: absolute;
    bottom: 120%;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: hsl(var(--fg));
    border: 1px solid hsl(var(--border));
    font-size: 0.7rem;
    padding: 0.4rem 0.6rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    transform-origin: bottom;
  }

  .skip-btn:hover .skip-tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }


  .voice-orb {
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    background: #000;
    border: 1px solid hsl(var(--border));
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .voice-orb svg {
    width: 18px;
    height: 18px;
    stroke: hsl(var(--fg));
    fill: none;
    stroke-width: 2;
  }

  .voice-orb:hover {
    border-color: hsl(var(--primary));
  }

  .voice-orb.recording {
    border-color: hsl(var(--primary));
    box-shadow: 0 0 0 4px hsl(var(--primary) / 0.1);
  }

  .voice-orb.recording svg {
    stroke: hsl(var(--primary));
  }

  .voice-orb.recording {
    border-color: hsl(var(--primary));
    box-shadow: 0 0 0 4px hsl(var(--primary) / 0.1);
  }

  .voice-orb.recording svg {
    stroke: hsl(var(--primary));
  }
  .send-orb {
    border: 1px solid hsl(var(--border));
  }

  .send-orb svg {
    width: 18px;
    height: 18px;
    stroke: hsl(var(--fg));
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .send-orb:hover:not(:disabled) {
    border-color: hsl(var(--primary));
  }

  .send-orb:hover:not(:disabled) svg {
    stroke: hsl(var(--primary));
  }
  .send-orb:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
    @media (max-width: 640px) {

    .chat-input-inner {
      padding: 0.6rem;
      gap: 0.4rem;
    }

    .chat-input {
      font-size: 0.85rem;
      height: 2.6rem;
    }

    .voice-orb {
      width: 2.6rem;
      height: 2.6rem;
    }

    .skip-btn {
      font-size: 0.75rem;
      padding: 0.3rem 0.5rem;
    }

    .chat-topbar-inner {
      padding: 0.6rem;
    }

    .progress-bar {
      width: 4rem;
    }
    }

    .voice-only {
  display: flex;
  justify-content: center;
  padding: 1.2rem;
}

.voice-main-btn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 1px solid #7c3aed;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.3s ease;
}

.voice-main-btn svg {
  width: 24px;
  height: 24px;
  stroke: white;
  fill: none;
  stroke-width: 1.8;
}

.voice-main-btn:hover {
  background: #7c3aed;
  box-shadow: 0 0 20px rgba(124,58,237,0.4);
}

.hidden {
  display: none;
}
</style>
</head>
<body>
<!-- ===== SETUP SCREEN ===== -->
<div id="setup" class="screen active">
  <div class="orb" style="top:5rem;left:25%;width:18rem;height:18rem;background:hsl(var(--primary)/0.1);filter:blur(120px)"></div>
  <div class="orb" style="bottom:5rem;right:25%;width:16rem;height:16rem;background:hsl(var(--accent)/0.1);filter:blur(100px);animation-delay:-3s"></div>
  <div class="setup-card animate-fade-in">
    <div class="setup-header">
      <div class="setup-icon gradient-primary glow-primary">
        <svg class="icon-xl" fill="none" stroke="hsl(var(--primary-fg))" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
      </div>
      <h1 class="setup-title">AI <span class="text-gradient">Interviewer</span></h1>
      <p class="setup-subtitle">Let's set up your personalized mock interview</p>
    </div>
    <div class="glass" style="border-radius:1rem;padding:2rem">
      <div class="form-group">
        <label class="form-label" for="inp-name">Full Name</label>
        <input class="form-input" id="inp-name" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label class="form-label">💼 Target Role</label>
        <select class="form-select" id="inp-role">
          <option value="">Select a role</option>
          <option>Frontend Developer</option><option>Backend Developer</option>
          <option>Full Stack Developer</option><option>Data Scientist</option>
          <option>DevOps Engineer</option><option>Mobile Developer</option>
          <option>Product Manager</option><option>UI/UX Designer</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Experience Level</label>
        <div class="exp-grid" id="exp-grid">
          <button class="exp-btn" data-val="junior">Junior (0-2 yrs)</button>
          <button class="exp-btn" data-val="mid">Mid-Level (2-5 yrs)</button>
          <button class="exp-btn" data-val="senior">Senior (5-8 yrs)</button>
          <button class="exp-btn" data-val="lead">Lead/Staff (8+ yrs)</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="inp-tech">🧑‍💻 Tech Stack / Skills</label>
        <input class="form-input" id="inp-tech" placeholder="React, TypeScript, Node.js..." />
      </div>
      <button class="btn-primary" id="btn-start" disabled>Start Interview →</button>
    </div>
  </div>
</div>
<!-- ===== INTERVIEW SCREEN ===== -->
<div id="interview" class="screen">
  <div class="orb" style="top:2rem;right:25%;width:24rem;height:24rem;background:hsl(var(--primary)/0.08);filter:blur(140px);position:fixed"></div>
  <div class="orb" style="bottom:2rem;left:25%;width:20rem;height:20rem;background:hsl(var(--accent)/0.06);filter:blur(120px);position:fixed"></div>
  <div class="chat-topbar glass-subtle">
    <div class="chat-topbar-inner">
      <div class="topbar-left">
        <div class="topbar-avatar">

          <svg width="20" height="20" fill="none" stroke="hsl(var(--primary-fg))" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </div>
        <div>
          <p class="topbar-title">AI Interviewer</p>
          <p class="topbar-sub" id="topbar-info"></p>
        </div>
      </div>
      <div class="topbar-right">

        <div class="progress-wrapper">
          <span class="progress-text" id="q-counter"></span>
          <div class="progress-bar">
            <div class="progress-fill gradient-primary"
                 id="progress-fill"
                 style="width:0%">
            </div>
          </div>
        </div>
      
        <!-- SIMPLE MODE TOGGLE -->
        <div class="mode-switch">
          <span class="mode-label">Text</span>
          <div class="toggle" id="modeToggle"></div>
          <span class="mode-label">Voice</span>
        </div>
      
      </div>
      
    </div>
  </div>
  <div class="messages-area" id="messages-area">
    <div class="messages-inner" id="messages"></div>
  </div>
  <div class="chat-input-bar glass-subtle">

    <!-- TEXT MODE -->
    <div class="chat-input-inner" id="textModeUI">
  
      <!-- Skip -->
      <button id="btn-skip" class="skip-btn">
        Skip
        <span class="skip-tooltip">Skip to next question</span>
      </button>
  
      <!-- Mic -->
      <button id="btn-mic" class="voice-orb">
        <svg viewBox="0 0 24 24">
          <path d="M12 3v12M8 7v4a4 4 0 008 0V7M5 11a7 7 0 0014 0"/>
        </svg>
      </button>
  
      <input class="chat-input" id="chat-input"
             placeholder="Type your answer..." />
  
      <!-- Send -->
      <button id="btn-send" class="voice-orb send-orb">
        <svg viewBox="0 0 24 24">
          <path d="M12 5v14M5 12l7-7 7 7"/>
        </svg>
      </button>
  
    </div>
  
    <!-- VOICE MODE ONLY -->
    <div class="voice-only hidden" id="voiceModeUI">
      <button class="voice-main-btn" id="voiceConversationBtn">
        <svg viewBox="0 0 24 24">
          <path d="M12 3v12M8 7v4a4 4 0 008 0V7M5 11a7 7 0 0014 0"/>
        </svg>
      </button>
    </div>
  
  </div>
<!-- ===== SCORECARD SCREEN ===== -->
<div id="scorecard" class="screen">
  <div class="orb" style="top:5rem;left:25%;width:20rem;height:20rem;background:hsl(var(--primary)/0.1);filter:blur(130px);position:fixed"></div>
  <div class="orb" style="bottom:5rem;right:25%;width:18rem;height:18rem;background:hsl(var(--accent)/0.08);filter:blur(110px);position:fixed;animation-delay:-3s"></div>
  <div class="sc-container animate-fade-in" id="sc-content"></div>
</div>
<script>
// ===== STATE =====
let profile = { name: '', role: '', experienceLevel: '', techStack: '' };
let selectedExp = '';
let questions = [];
let chatMessages = [];
let questionIndex = 1;
let isTyping = false;
let recognition;
let isRecording = false;
let voiceEnabled = false;

// ===== DOM REFS =====
const $ = id => document.getElementById(id);
// ===== HELPERS =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function scoreColor(s) { return s >= 80 ? 'c-success' : s >= 60 ? 'c-primary' : s >= 40 ? 'c-warning' : 'c-destructive'; }
function scoreBg(s) { return s >= 80 ? 'bg-success' : s >= 60 ? 'gradient-primary' : s >= 40 ? 'bg-warning' : 'bg-destructive'; }
function recIcon(s) {
  if (s >= 80) return `<svg class="icon" fill="none" stroke="hsl(var(--success))" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
  if (s >= 50) return `<svg class="icon" fill="none" stroke="hsl(var(--warning))" stroke-width="2" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
  return `<svg class="icon" fill="none" stroke="hsl(var(--destructive))" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
}
// ===== SETUP SCREEN LOGIC =====
const expBtns = document.querySelectorAll('.exp-btn');
expBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    selectedExp = btn.dataset.val;
    expBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    checkValid();
  });
});
function checkValid() {
  $('btn-start').disabled = !($('inp-name').value.trim() && $('inp-role').value && selectedExp);
}
$('inp-name').addEventListener('input', checkValid);
$('inp-role').addEventListener('change', checkValid);
$('btn-start').addEventListener('click', () => {
  profile = { name: $('inp-name').value.trim(), role: $('inp-role').value, experienceLevel: selectedExp, techStack: $('inp-tech').value.trim() };
  startInterview();
});
// ===== INTERVIEW LOGIC =====
function generateQuestions(p) {
  const base = [`Welcome ${p.name}! I'll be conducting your mock interview for the ${p.role} position. Let's begin.\n\nTell me about yourself and your experience.`];
  const map = {
    "Frontend Developer": ["Can you explain the difference between CSS Grid and Flexbox? When would you use one over the other?","How do you approach state management in a large-scale React application?","Describe a challenging UI performance issue you've solved.","How do you ensure accessibility in your web applications?","Walk me through how you'd architect a complex form with real-time validation."],
    "Backend Developer": ["How would you design a REST API for a social media platform?","Explain how you'd handle database migrations in production.","How do you approach error handling and logging in backend services?","Describe your experience with microservices architecture.","How would you implement rate limiting for an API?"],
    "Full Stack Developer": ["How do you decide what logic goes on the frontend vs backend?","Describe your approach to authentication and authorization across the stack.","How would you optimize a slow page that involves multiple API calls?","Walk me through deploying a full-stack application from scratch.","How do you handle real-time data synchronization between client and server?"],
  };
  const def = ["Describe a challenging project you've worked on recently.","How do you approach debugging complex issues?","What's your process for learning new technologies?","How do you handle disagreements about technical decisions?","Where do you see yourself in 3-5 years?"];
  return [...base, ...(map[p.role] || def)];
}
function startInterview() {
  questions = generateQuestions(profile);
  questionIndex = 1;
  chatMessages = [{ role: 'assistant', content: questions[0] }];
  speakText(questions[0]);

  $('topbar-info').textContent = `${profile.role} · ${profile.experienceLevel}`;
  renderMessages();
  updateProgress();
  showScreen('interview');
  $('chat-input').focus();
}
function renderMessages() {
  const c = $('messages');
  c.innerHTML = chatMessages.map(m => `
    <div class="msg-row ${m.role === 'user' ? 'user' : ''} animate-slide-up">
      <div class="msg-avatar ${m.role === 'assistant' ? 'bot gradient-primary glow-primary' : 'human'}">
        ${m.role === 'assistant'
          ? '<svg width="16" height="16" fill="none" stroke="hsl(var(--primary-fg))" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>'
          : '<svg width="16" height="16" fill="none" stroke="hsl(var(--secondary-fg))" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
        }
      </div>
      <div class="msg-bubble ${m.role === 'assistant' ? 'bot glass' : 'human'}">${m.content}</div>
    </div>
  `).join('');
  if (isTyping) {
    c.innerHTML += `<div class="msg-row animate-fade-in"><div class="msg-avatar bot"><svg width="16" height="16" fill="none" stroke="hsl(var(--primary-fg))" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></div><div class="glass" style="border-radius:1rem"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
  }
  $('messages-area').scrollTop = $('messages-area').scrollHeight;
}
function updateProgress() {
  const total = questions.length;
  const pct = Math.round((questionIndex / total) * 100);
  $('q-counter').textContent = `Q${Math.min(questionIndex, total)}/${total}`;
  $('progress-fill').style.width = pct + '%';
}
function sendMessage() {
  const val = $('chat-input').value.trim();
  if (!val || isTyping) return;
  chatMessages.push({ role: 'user', content: val });
  $('chat-input').value = '';
  isTyping = true;
  $('btn-send').disabled = true;
  $('chat-input').disabled = true;
  renderMessages();
  setTimeout(() => {
    if (questionIndex < questions.length) {
      chatMessages.push({ role: 'assistant', content: questions[questionIndex] });
      speakText(questions[questionIndex]);

      questionIndex++;
      updateProgress();
    } else {
      chatMessages.push({ role: 'assistant', content: "Great answers! That concludes our interview. I'll now generate your scorecard. Thank you for your time!" });
      isTyping = false;
      renderMessages();
      setTimeout(() => renderScorecard(), 2000);
      return;
    }
    isTyping = false;
    $('chat-input').disabled = false;
    $('btn-send').disabled = false;
    renderMessages();
    $('chat-input').focus();
  }, 1200);
}
$('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
$('chat-input').addEventListener('input', () => { $('btn-send').disabled = !$('chat-input').value.trim(); });
$('btn-send').addEventListener('click', sendMessage);
// ===== SCORECARD LOGIC =====
function renderScorecard() {
  const skillSets = {
    "Frontend Developer": ["React","CSS/Styling","JavaScript","TypeScript","Performance","Accessibility"],
    "Backend Developer": ["Backend Dev","Databases","SQL","Python","AWS","Terraform"],
    "Full Stack Developer": ["Frontend Arch","Backend APIs","DB Design","DevOps","System Design","Testing"],
  };
  const skills = (skillSets[profile.role] || ["Problem Solving","System Design","Code Quality","Architecture","Testing","Documentation"]);
  const base = (profile.experienceLevel === 'senior' || profile.experienceLevel === 'lead') ? 55 : 40;
  const reviews = [
    "Demonstrated solid understanding of core concepts. Could elaborate more on trade-offs.",
    "Good coverage of key topics with relevant examples. More specific tools would strengthen responses.",
    "Provided relevant information but lacked depth in certain areas.",
    "Strong practical knowledge shown. Consider discussing edge cases more thoroughly.",
    "Adequate understanding demonstrated. Including monitoring details would enhance responses.",
    "Mentioned key concepts but did not discuss specific implementation methods.",
  ];
  const skillScores = skills.map((name, i) => ({ name, score: Math.min(98, Math.max(0, base + Math.floor(Math.random() * 50))), review: reviews[i % reviews.length] }));
  const commScores = [{ name: 'Grammar', score: 60 + Math.floor(Math.random() * 30) }, { name: 'Professional Language', score: 50 + Math.floor(Math.random() * 35) }];
  const skillAvg = Math.round(skillScores.reduce((a, c) => a + c.score, 0) / skillScores.length);
  const commAvg = Math.round(commScores.reduce((a, c) => a + c.score, 0) / commScores.length);
  const today = new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
  const time = (15 + Math.floor(Math.random() * 20)) + ' minutes';
  const recText = (n, s) => s >= 80 ? `Very good understanding of ${n.toLowerCase()} with a score of ${s}%.` : s >= 50 ? `Average ${n.toLowerCase()} performance at ${s}%, could improve.` : `Very poor ${n.toLowerCase()} skills at ${s}%, needs major improvement.`;
  $('sc-content').innerHTML = `
    <!-- Header -->
    <div class="sc-section glass">
      <div class="sc-label">🎯 Interview Report</div>
      <h1 class="sc-name">${profile.name}</h1>
      <div class="sc-meta">
        <span>📅 Interview date — ${today}</span>
        <span>⏱ Total time — ${time}</span>
      </div>
      <h2 class="sc-role text-gradient">${profile.role}</h2>
      <div class="sc-info-grid">
        <div class="sc-info-card"><div class="label">Experience Level</div><div class="value">${profile.experienceLevel}</div></div>
        <div class="sc-info-card"><div class="label">Target Role</div><div class="value">${profile.role}</div></div>
        <div class="sc-info-card"><div class="label">Tech Stack</div><div class="value">${profile.techStack || 'Not specified'}</div></div>
      </div>
    </div>
    <!-- Round-wise Scores -->
    <div class="sc-section glass">
      <div class="sc-heading">⭐ Round-wise Scores</div>
      <div class="sc-round-grid">
        <div class="sc-round-card"><div class="sc-round-label">Skill Based Round</div><div class="sc-round-score ${scoreColor(skillAvg)}">${skillAvg}<span class="sc-round-total"> / 100</span></div></div>
        <div class="sc-round-card"><div class="sc-round-label">Communication Round</div><div class="sc-round-score ${scoreColor(commAvg)}">${commAvg}<span class="sc-round-total"> / 100</span></div></div>
      </div>
    </div>
    <!-- Skill Based Round -->
    <div class="sc-section glass">
      <div class="sc-heading" style="justify-content:space-between">
        <span>💡 Skill Based Round</span>
        <span class="${scoreColor(skillAvg)}" style="font-family:'JetBrains Mono';font-size:1.2rem;font-weight:700">${skillAvg}/100</span>
      </div>
      <div class="sc-section-title">Stats</div>
      <div class="sc-stats-grid">
        ${skillScores.map(s => `<div class="sc-stat-card"><div class="sc-stat-name">${s.name}</div><div class="sc-stat-row"><span class="sc-stat-val ${scoreColor(s.score)}">${s.score}%</span><div class="sc-bar"><div class="sc-bar-fill ${scoreBg(s.score)}" style="width:${s.score}%"></div></div></div></div>`).join('')}
      </div>
      <div class="sc-section-title">Skill-wise Performance Review</div>
      ${skillScores.map(s => `<div class="sc-review-item"><div class="sc-review-title">▸ ${s.name}<span class="score ${scoreColor(s.score)}">${s.score}%</span></div><div class="sc-review-text">${s.review}</div></div>`).join('')}
    </div>
    <!-- Communication -->
    <div class="sc-section glass">
      <div class="sc-heading" style="justify-content:space-between">
        <span>💬 Communication Analysis</span>
        <span class="${scoreColor(commAvg)}" style="font-family:'JetBrains Mono';font-size:1.2rem;font-weight:700">${commAvg}/100</span>
      </div>
      <div class="sc-section-title">Stats</div>
      <div class="sc-stats-grid">
        ${commScores.map(s => `<div class="sc-stat-card"><div class="sc-stat-name">${s.name}</div><div class="sc-stat-row"><span class="sc-stat-val ${scoreColor(s.score)}">${s.score}%</span><div class="sc-bar"><div class="sc-bar-fill ${scoreBg(s.score)}" style="width:${s.score}%"></div></div></div></div>`).join('')}
      </div>
      <div class="sc-review-item"><div class="sc-review-title">Communication Skills Review</div><div class="sc-review-text">Grammar score reflects mostly accurate spoken grammar with some minor errors. Professional language usage is generally appropriate with clear technical vocabulary.</div></div>
    </div>
    <!-- Proctoring -->
    <div class="sc-section glass">
      <div class="sc-heading">🛡 Proctoring</div>
      <div class="sc-proctor-grid">
        <div class="sc-proctor-card"><svg class="icon" fill="none" stroke="hsl(var(--success))" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><div><div class="sc-proctor-label">No Distractions</div><div class="sc-proctor-status">Good</div></div></div>
        <div class="sc-proctor-card"><svg class="icon" fill="none" stroke="hsl(var(--success))" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><div><div class="sc-proctor-label">Single Person</div><div class="sc-proctor-status">Good</div></div></div>
        <div class="sc-proctor-card"><svg class="icon" fill="none" stroke="hsl(var(--success))" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><div><div class="sc-proctor-label">Stable Connection</div><div class="sc-proctor-status">Good</div></div></div>
      </div>
    </div>
    <!-- Final Recommendation -->
    <div class="sc-section glass">
      <div class="sc-heading">📈 Final Recommendation</div>
      ${skillScores.slice(0, 4).map(s => `<div class="sc-rec-item">${recIcon(s.score)}<div class="sc-rec-text">${recText(s.name, s.score)}</div></div>`).join('')}
      <div class="sc-rec-item">${recIcon(commAvg)}<div class="sc-rec-text">${commAvg >= 65 ? `Good communication abilities with an overall score of ${commAvg}%.` : `Communication skills need improvement at ${commAvg}%.`}</div></div>
    </div>
    <!-- Actions -->
    <div style="display:flex;gap:0.75rem;margin-bottom:2rem">
      <button class="btn-outline glass" id="btn-restart" style="border:1px solid hsl(var(--border)/0.5)">🔄 Retake Interview</button>
    </div>
  `;
  $('btn-restart').addEventListener('click', () => {
    $('inp-name').value = ''; $('inp-role').value = ''; $('inp-tech').value = '';
    selectedExp = ''; expBtns.forEach(b => b.classList.remove('selected'));
    $('btn-start').disabled = true;
    showScreen('setup');
  });
  showScreen('scorecard');
}

function skipQuestion() {
  if (isTyping) return;

  chatMessages.push({ role: 'user', content: "Skipped this question." });
  renderMessages();

  isTyping = true;

  setTimeout(() => {
    if (questionIndex < questions.length) {
      chatMessages.push({ role: 'assistant', content: questions[questionIndex] });
      speakText(questions[questionIndex]);

      questionIndex++;
      updateProgress();
    } else {
      chatMessages.push({ role: 'assistant', content: "Interview completed. Generating scorecard..." });
      renderMessages();
      setTimeout(() => renderScorecard(), 1500);
      return;
    }

    isTyping = false;
    renderMessages();
  }, 800);
}

function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Speech recognition not supported in this browser.");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    $('chat-input').value = transcript;
    $('btn-send').disabled = false;
  };

  recognition.onend = function() {
    isRecording = false;
    $('btn-mic').classList.remove('recording');
  };
}

$('btn-mic').addEventListener('click', () => {
  if (!recognition) return;

  if (!isRecording) {
    recognition.start();
    isRecording = true;
    $('btn-mic').classList.add("recording");;
  } else {
    recognition.stop();
    isRecording = false;
    $('btn-mic').classList.remove('recording');
  }
});

function speakText(text) {
  if (!voiceEnabled) return;

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 1;
  utterance.pitch = 1;

  utterance.onstart = function () {
    if (voiceBtn) voiceBtn.classList.add("recording");
  };

  utterance.onend = function () {
    if (voiceBtn) voiceBtn.classList.remove("recording");

    // Auto start listening after AI finishes speaking
    if (isVoiceMode) {
      recognition.start();
      isRecording = true;
    }
  };

  speechSynthesis.speak(utterance);
}


const input = document.querySelector('#chat-input');
const sendBtn = document.querySelector('#btn-send');

input.addEventListener('input', () => {
  if (input.value.trim() !== "") {
    sendBtn.style.borderColor = "hsl(var(--primary))";
  } else {
    sendBtn.style.borderColor = "hsl(var(--border))";
  }
});

window.addEventListener("resize", () => {
  const interview = document.getElementById("interview");
  interview.style.height = window.innerHeight + "px";
});


const toggle = document.getElementById("modeToggle");
const textModeUI = document.getElementById("textModeUI");
const voiceModeUI = document.getElementById("voiceModeUI");

let isVoiceMode = false;

toggle.addEventListener("click", () => {

  isVoiceMode = !isVoiceMode;
  toggle.classList.toggle("active");

  if (isVoiceMode) {
    voiceEnabled = true;
    textModeUI.classList.add("hidden");
    voiceModeUI.classList.remove("hidden");

    // Speak current question immediately
    if (questions.length > 0) {
        speakText(questions[questionIndex - 1]);
    }

} else {
    voiceEnabled = false;
    voiceModeUI.classList.add("hidden");
    textModeUI.classList.remove("hidden");
}

});

const voiceBtn = document.getElementById("voiceConversationBtn");


function initVoiceRecognition() {
  console.log("inside recognition")
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Speech Recognition not supported in this browser");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-US";

    recognition.onresult = function(event) {

    const transcript = event.results[0][0].transcript;

    // Add transcript to chat as user message
    chatMessages.push({
        role: 'user',
        content: `🎤 ${transcript}`
    });

    renderMessages();

    processVoiceAnswer(transcript);
    };


    recognition.onend = function() {
        voiceBtn.classList.remove("recording"); 
        isRecording = false;
    };
}

voiceBtn.addEventListener("click", function() {
  console.log("button clicked")
    if (recognition) initVoiceRecognition();

    if (!isRecording) {
        recognition.start();
        voiceBtn.classList.add("recording");
        isRecording = true;
    } else {
        recognition.stop();
    }
});


function handleDummyResponse(userMessage) {

let dummyResponse = "";

const msg = userMessage.toLowerCase();

if (msg.includes("hello")) {
    dummyResponse = "Hello. Nice to meet you. Please tell me about yourself.";
} 
else if (msg.includes("experience")) {
    dummyResponse = "That sounds interesting. Can you explain one challenging project you worked on?";
} 
else if (msg.includes("skills")) {
    dummyResponse = "Great. How confident are you in those skills from one to ten?";
} 
else {
    dummyResponse = "Thank you for your response. Let us move to the next question.";
}

speakResponse(dummyResponse);
}


function speakResponse(text) {

const speech = new SpeechSynthesisUtterance(text);
speech.lang = "en-US";
speech.rate = 1;
speech.pitch = 1;

speech.onstart = function() {
    voiceBtn.classList.add("recording");  // glow while AI speaking
};

speech.onend = function() {
    voiceBtn.classList.remove("recording");
};

window.speechSynthesis.speak(speech);
}


function processVoiceAnswer(transcript) {

isTyping = true;
renderMessages();

setTimeout(() => {

    if (questionIndex < questions.length) {

        chatMessages.push({
            role: 'assistant',
            content: questions[questionIndex]
        });

        renderMessages();

        speakText(questions[questionIndex]);

        questionIndex++;
        updateProgress();

    } else {

        chatMessages.push({
            role: 'assistant',
            content: "Great answers! Interview completed. Generating scorecard..."
        });

        renderMessages();

        setTimeout(() => renderScorecard(), 1500);
        return;
    }

    isTyping = false;

}, 1000);
}


// ===== INITIALIZE VOICE & SKIP =====
$('btn-skip').addEventListener('click', skipQuestion);
initSpeechRecognition();


</script>
