<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – AI Interview</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f8f9fa;
  --card: #fff;
  --border: rgba(0,0,0,0.1);
  --text: #1a1a1a;
  --muted: rgba(0,0,0,0.5);
  --accent: #7c3aed;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: var(--bg);
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

.auth-container {
  width: 100%;
  max-width: 500px;
  padding: 2rem;
}

.auth-card {
  background: var(--card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2.5rem;
  box-shadow: 0 0 40px rgba(124, 58, 237, 0.1);
}

.auth-title {
  font-size: 1.6rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.auth-subtitle {
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 2rem;
}

.input-group {
  margin-bottom: 1.2rem;
}

.input-group label {
  font-size: 0.8rem;
  color: var(--muted);
  display: block;
  margin-bottom: 0.4rem;
}

.input-group input {
  width: 100%;
  height: 46px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0 12px;
  color: var(--text);
  font-size: 0.9rem;
  transition: 0.3s;
}

.input-group input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.auth-btn {
  width: 100%;
  height: 48px;
  border-radius: 12px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--text);
  font-weight: 500;
  cursor: pointer;
  transition: 0.3s;
}

.auth-btn:hover {
  background: var(--accent);
  color: #fff;
}

.auth-footer {
  margin-top: 1.5rem;
  text-align: center;
  font-size: 0.85rem;
  color: var(--muted);
}

.auth-footer a {
  color: var(--accent);
  text-decoration: none;
}
</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-title">Welcome back</div>
    <div class="auth-subtitle">Sign in to continue your AI interview</div>
    <form  method="POST">
      {% csrf_token %}

    <div class="input-group">
      <label>Email</label>
      <input type="email" name="email" placeholder="Enter your email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password">
    </div>

    <button class="auth-btn">Sign In</button>
  </form>

    <div class="auth-footer">
      Don’t have an account?
      <a href="{% url 'signup' %}">Create one</a>
    </div>
  </div>
</div>

</body>
</html>
